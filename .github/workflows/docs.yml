name: docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # toda segunda: links externos quebram sem ninguém mexer no repo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Links internos, âncoras e estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

  external-links:
    name: Links externos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config ./lychee.toml
            --no-progress
            --cache --max-cache-age 1d
            --exclude-path node_modules
            './**/*.md'
          fail: true
