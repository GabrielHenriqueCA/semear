<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Microsoft DP-800: SQL AI Developer Associate. SEMEAR Method.">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-dp800" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121D"/>
      <stop offset="0.5" stop-color="#0B2035"/>
      <stop offset="1" stop-color="#062B38"/>
    </linearGradient>

    <!-- Typography & Accent Gradients -->
    <linearGradient id="text-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00A4EF"/>
      <stop offset="0.45" stop-color="#00C9A7"/>
      <stop offset="1" stop-color="#7CFF6B"/>
    </linearGradient>

    <linearGradient id="facet-top-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#00A4EF"/>
    </linearGradient>

    <linearGradient id="facet-top-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CFF6B"/>
      <stop offset="1" stop-color="#00C9A7"/>
    </linearGradient>

    <linearGradient id="tier-plate-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00A4EF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#005A9E" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="tier-plate-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C9A7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#086B63" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="tier-plate-3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0078D4" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="ambient-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00C9A7" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#0078D4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0078D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="core-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7CFF6B" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#00C9A7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00C9A7" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="grid-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#5EEAD4"/>
    </pattern>

    <!-- Card Clip -->
    <clipPath id="card-radius"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card-radius)">
    <!-- Base Background -->
    <rect width="1280" height="320" fill="url(#bg-dp800)"/>
    <rect width="1280" height="320" fill="url(#grid-dots)" opacity="0.08"/>

    <!-- Soft Glow Spheres -->
    <circle cx="220" cy="160" r="240" fill="url(#ambient-glow)"/>
    <circle cx="205" cy="85" r="90" fill="url(#core-glow)"/>

    <!-- Ambient Floating Circuit Network Behind Elements -->
    <g stroke="#00C9A7" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.35" fill="none">
      <path d="M 60 120 L 110 80 L 140 100"/>
      <path d="M 270 60 L 330 40 L 390 70"/>
      <path d="M 290 230 L 350 250 L 400 220"/>
      <path d="M 70 210 L 110 240 L 150 220"/>
    </g>

    <!-- ========================================== -->
    <!-- LEFT ARTWORK: Modern Isometric SQL AI Platform -->
    <!-- ========================================== -->
    <g transform="translate(10 5)">

      <!-- Microsoft 4-Color Accent in top corner -->
      <g transform="translate(45 35)" opacity="0.95">
        <rect x="0" y="0" width="13" height="13" rx="2.5" fill="#F25022"/>
        <rect x="16" y="0" width="13" height="13" rx="2.5" fill="#7FBA00"/>
        <rect x="0" y="16" width="13" height="13" rx="2.5" fill="#00A4EF"/>
        <rect x="16" y="16" width="13" height="13" rx="2.5" fill="#FFB900"/>
      </g>

      <!-- ISOMETRIC TIER 1 (Base Storage & Governance) -->
      <g opacity="0.95">
        <!-- Shadow base -->
        <path d="M 205 240 L 305 285 L 205 320 L 105 285 Z" fill="#030C14" opacity="0.5"/>
        <!-- Left Side Face -->
        <path d="M 105 235 L 205 280 L 205 298 L 105 253 Z" fill="#051C2C" stroke="#0078D4" stroke-width="1" stroke-opacity="0.4"/>
        <!-- Right Side Face -->
        <path d="M 205 280 L 305 235 L 305 253 L 205 298 Z" fill="#08283D" stroke="#0078D4" stroke-width="1" stroke-opacity="0.4"/>
        <!-- Top Face Plate -->
        <path d="M 205 190 L 305 235 L 205 280 L 105 235 Z" fill="url(#tier-plate-1)" stroke="#50E6FF" stroke-width="1.8" stroke-opacity="0.8"/>
        <!-- Circuit inlays on Tier 1 -->
        <path d="M 135 235 L 205 266 L 275 235" stroke="#50E6FF" stroke-width="1.5" fill="none" opacity="0.5"/>
      </g>

      <!-- ISOMETRIC TIER 2 (SQL Engine & Query Store) -->
      <g opacity="0.98">
        <!-- Floating shadow -->
        <path d="M 205 185 L 295 225 L 205 260 L 115 225 Z" fill="#03101C" opacity="0.4"/>
        <!-- Left Side Face -->
        <path d="M 115 175 L 205 215 L 205 230 L 115 190 Z" fill="#063238" stroke="#00C9A7" stroke-width="1" stroke-opacity="0.5"/>
        <!-- Right Side Face -->
        <path d="M 205 215 L 295 175 L 295 190 L 205 230 Z" fill="#0A464D" stroke="#00C9A7" stroke-width="1" stroke-opacity="0.5"/>
        <!-- Top Face Plate -->
        <path d="M 205 135 L 295 175 L 205 215 L 115 175 Z" fill="url(#tier-plate-2)" stroke="#5EEAD4" stroke-width="2"/>
        <!-- Tech Inlays on Tier 2 -->
        <path d="M 145 175 L 205 202 L 265 175" stroke="#7CFF6B" stroke-width="1.8" fill="none" opacity="0.6"/>
        <circle cx="205" cy="202" r="3.5" fill="#7CFF6B"/>
      </g>

      <!-- ISOMETRIC TIER 3 (AI Vector & Neural Fabric) -->
      <g opacity="0.98">
        <!-- Left Side Face -->
        <path d="M 130 115 L 205 148 L 205 160 L 130 127 Z" fill="#094A52" stroke="#5EEAD4" stroke-width="1" stroke-opacity="0.6"/>
        <!-- Right Side Face -->
        <path d="M 205 148 L 280 115 L 280 127 L 205 160 Z" fill="#0C6266" stroke="#5EEAD4" stroke-width="1" stroke-opacity="0.6"/>
        <!-- Top Face Plate (Glassmorphism effect) -->
        <path d="M 205 82 L 280 115 L 205 148 L 130 115 Z" fill="url(#tier-plate-3)" stroke="#7CFF6B" stroke-width="2.2"/>
        <!-- Glowing Core Center Ring on Tier 3 -->
        <ellipse cx="205" cy="115" rx="36" ry="16" fill="#0B2535" stroke="#7CFF6B" stroke-width="2" stroke-dasharray="4,2"/>
        <ellipse cx="205" cy="115" rx="14" ry="6" fill="#7CFF6B" opacity="0.8"/>
      </g>

      <!-- Vertical Energy Columns (Connecting Tiers) -->
      <g stroke="#5EEAD4" stroke-width="2" opacity="0.75">
        <line x1="130" y1="127" x2="115" y2="175"/>
        <line x1="280" y1="127" x2="295" y2="175"/>
        <line x1="115" y1="190" x2="105" y2="235"/>
        <line x1="295" y1="190" x2="305" y2="235"/>
      </g>

      <!-- ========================================== -->
      <!-- FLOATING HOLOGRAPHIC AI VECTOR PRISM / CORE -->
      <!-- ========================================== -->
      <g>
        <!-- Beam from tier to core -->
        <polygon points="205,115 190,75 220,75" fill="#7CFF6B" opacity="0.25"/>

        <!-- Octahedron Diamond Facets -->
        <!-- Top Left Facet -->
        <polygon points="205,25 170,55 205,72" fill="url(#facet-top-left)" stroke="#50E6FF" stroke-width="1.5" opacity="0.95"/>
        <!-- Top Right Facet -->
        <polygon points="205,25 240,55 205,72" fill="url(#facet-top-right)" stroke="#7CFF6B" stroke-width="1.5" opacity="0.95"/>
        <!-- Bottom Left Facet -->
        <polygon points="205,92 170,55 205,72" fill="#005A9E" stroke="#50E6FF" stroke-width="1.5" opacity="0.85"/>
        <!-- Bottom Right Facet -->
        <polygon points="205,92 240,55 205,72" fill="#007866" stroke="#7CFF6B" stroke-width="1.5" opacity="0.85"/>

        <!-- Core Pulse Center Light -->
        <circle cx="205" cy="58" r="6" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="205" cy="58" r="14" fill="#7CFF6B" opacity="0.35"/>
      </g>

      <!-- ========================================== -->
      <!-- CONSTELLATION NODES & VECTOR EMBEDDING RAYS -->
      <!-- ========================================== -->
      <g>
        <!-- Laser connecting lines -->
        <line x1="170" y1="55" x2="90" y2="70" stroke="#00C9A7" stroke-width="2" opacity="0.7"/>
        <line x1="240" y1="55" x2="320" y2="50" stroke="#7CFF6B" stroke-width="2" opacity="0.7"/>
        <line x1="90" y1="70" x2="70" y2="150" stroke="#00A4EF" stroke-width="1.5" opacity="0.5"/>
        <line x1="320" y1="50" x2="340" y2="135" stroke="#5EEAD4" stroke-width="1.5" opacity="0.5"/>
        <line x1="340" y1="135" x2="330" y2="215" stroke="#00C9A7" stroke-width="1.5" opacity="0.5"/>
        <line x1="205" y1="280" x2="330" y2="215" stroke="#50E6FF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>

        <!-- High-tech Vector Nodes -->
        <!-- Node 1: Left Top -->
        <circle cx="90" cy="70" r="15" fill="#091B28" stroke="#00C9A7" stroke-width="3"/>
        <circle cx="90" cy="70" r="5" fill="#5EEAD4"/>
        <text x="90" y="48" font-family="'Consolas', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#5EEAD4">RAG</text>

        <!-- Node 2: Right Top -->
        <circle cx="320" cy="50" r="16" fill="#091B28" stroke="#7CFF6B" stroke-width="3"/>
        <circle cx="320" cy="50" r="6" fill="#7CFF6B"/>
        <text x="320" y="28" font-family="'Consolas', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#7CFF6B">[v₁...vₙ]</text>

        <!-- Node 3: Left Mid -->
        <circle cx="70" cy="150" r="14" fill="#091B28" stroke="#00A4EF" stroke-width="2.5"/>
        <circle cx="70" cy="150" r="5" fill="#50E6FF"/>

        <!-- Node 4: Right Mid -->
        <circle cx="340" cy="135" r="15" fill="#091B28" stroke="#5EEAD4" stroke-width="2.5"/>
        <circle cx="340" cy="135" r="5" fill="#00C9A7"/>
        <text x="362" y="139" font-family="'Consolas', monospace" font-size="10" font-weight="600" fill="#A2CAD9">cosine()</text>

        <!-- Node 5: Right Bottom -->
        <circle cx="330" cy="215" r="15" fill="#091B28" stroke="#00C9A7" stroke-width="2.5"/>
        <circle cx="330" cy="215" r="5" fill="#7CFF6B"/>
        <text x="352" y="219" font-family="'Consolas', monospace" font-size="10" font-weight="600" fill="#5EEAD4">T-SQL</text>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- RIGHT HEADER & TYPOGRAPHY                   -->
    <!-- ========================================== -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <!-- Tag / Category Pill -->
      <rect x="520" y="50" width="225" height="28" rx="14" fill="#0078D4" fill-opacity="0.2" stroke="#00C9A7" stroke-opacity="0.8"/>
      <circle cx="536" cy="64" r="4" fill="#7CFF6B"/>
      <text x="638" y="69" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5" fill="#5EEAD4">MICROSOFT AZURE &amp; SQL</text>

      <!-- Exam Title DP-800 -->
      <text x="520" y="146" font-size="68" font-weight="800" letter-spacing="2.5" fill="url(#text-gradient)">DP-800</text>

      <!-- Subtitle -->
      <text x="520" y="186" font-size="24" font-weight="600" fill="#E6F8FF">SQL AI Developer Associate</text>

      <!-- Description Line -->
      <text x="520" y="222" font-size="16" fill="#A2CAD9">Modern database solutions, T-SQL, vector embeddings &amp; Azure OpenAI RAG.</text>

      <!-- Badges Row -->
      <g transform="translate(520 246)">
        <!-- Badge 1: Status -->
        <rect x="0" y="0" width="102" height="26" rx="6" fill="#00C9A7" fill-opacity="0.2" stroke="#00C9A7" stroke-opacity="0.75"/>
        <text x="51" y="17" font-size="12" font-weight="700" text-anchor="middle" fill="#00C9A7">PASSED ✅</text>

        <!-- Badge 2: Tech Core -->
        <rect x="112" y="0" width="160" height="26" rx="6" fill="#0078D4" fill-opacity="0.22" stroke="#0078D4" stroke-opacity="0.75"/>
        <text x="192" y="17" font-size="12" font-weight="600" text-anchor="middle" fill="#50E6FF">SQL + AI VECTORS</text>

        <!-- Badge 3: Platform -->
        <rect x="282" y="0" width="148" height="26" rx="6" fill="#7CFF6B" fill-opacity="0.16" stroke="#7CFF6B" stroke-opacity="0.7"/>
        <text x="356" y="17" font-size="12" font-weight="600" text-anchor="middle" fill="#7CFF6B">MICROSOFT LEARN</text>
      </g>
    </g>
  </g>
</svg>
