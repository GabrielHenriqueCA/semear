<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Microsoft DP-800: SQL AI Developer Associate. SEMEAR Method.">
  <defs>
    <linearGradient id="bg-dp800" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131D"/>
      <stop offset="0.5" stop-color="#0A2239"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="sql-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="0.5" stop-color="#00C9A7"/>
      <stop offset="1" stop-color="#7CFF6B"/>
    </linearGradient>
    <radialGradient id="glow-dp800" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00C9A7" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00C9A7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-dp800" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#00C9A7"/>
    </pattern>
    <clipPath id="card-dp800"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card-dp800)">
    <rect width="1280" height="320" fill="url(#bg-dp800)"/>
    <rect width="1280" height="320" fill="url(#grid-dp800)" opacity="0.07"/>
    <circle cx="230" cy="160" r="230" fill="url(#glow-dp800)"/>
    <!-- SQL Database & AI Neural Network Graphic -->
    <g transform="translate(100 60)">
      <!-- Cylinder Database stack -->
      <g opacity="0.9">
        <!-- Top Cylinder -->
        <ellipse cx="120" cy="50" rx="70" ry="22" fill="#0078D4" opacity="0.9"/>
        <path d="M50 50 v40 c0 12 31 22 70 22 s70 -10 70 -22 v-40 Z" fill="#005A9E" opacity="0.85"/>
        <ellipse cx="120" cy="90" rx="70" ry="22" fill="none" stroke="#50E6FF" stroke-width="2" opacity="0.4"/>
        <!-- Middle Cylinder -->
        <path d="M50 90 v40 c0 12 31 22 70 22 s70 -10 70 -22 v-40 Z" fill="#0E3D60" opacity="0.85"/>
        <ellipse cx="120" cy="130" rx="70" ry="22" fill="none" stroke="#50E6FF" stroke-width="2" opacity="0.4"/>
        <!-- Bottom Cylinder -->
        <path d="M50 130 v40 c0 12 31 22 70 22 s70 -10 70 -22 v-40 Z" fill="#0A2C46" opacity="0.95"/>
        <ellipse cx="120" cy="170" rx="70" ry="22" fill="#082033" opacity="0.9"/>
      </g>
      <!-- Neural Nodes & Vectors Floating Around -->
      <g opacity="0.85">
        <line x1="120" y1="50" x2="250" y2="40" stroke="#00C9A7" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="190" y1="90" x2="280" y2="100" stroke="#7CFF6B" stroke-width="2"/>
        <line x1="190" y1="130" x2="260" y2="160" stroke="#50E6FF" stroke-width="2"/>
        <circle cx="250" cy="40" r="7" fill="#00C9A7"/>
        <circle cx="280" cy="100" r="8" fill="#7CFF6B"/>
        <circle cx="260" cy="160" r="6" fill="#50E6FF"/>
        <line x1="250" y1="40" x2="280" y2="100" stroke="#00C9A7" stroke-width="1.5" opacity="0.6"/>
        <line x1="280" y1="100" x2="260" y2="160" stroke="#7CFF6B" stroke-width="1.5" opacity="0.6"/>
        <!-- Vector Array Bracket hint -->
        <text x="295" y="105" font-family="'Consolas', monospace" font-size="14" font-weight="700" fill="#7CFF6B">[0.12, 0.98, ...]</text>
      </g>
    </g>
    <!-- Content Header -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <rect x="520" y="52" width="220" height="28" rx="14" fill="#0078D4" fill-opacity="0.25" stroke="#00C9A7" stroke-opacity="0.8"/>
      <text x="630" y="71" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5" fill="#50E6FF">MICROSOFT AZURE &amp; SQL</text>
      <text x="520" y="145" font-size="64" font-weight="800" letter-spacing="2" fill="url(#sql-cyan)">DP-800</text>
      <text x="520" y="185" font-size="24" font-weight="600" fill="#E2F2FF">SQL AI Developer Associate</text>
      <text x="520" y="222" font-size="16" fill="#A5CDEC">Design, T-SQL, security, CI/CD, vectors &amp; embeddings, RAG with Azure OpenAI.</text>
      <!-- Badges row inside banner -->
      <g transform="translate(520 246)">
        <rect x="0" y="0" width="105" height="26" rx="6" fill="#00C9A7" fill-opacity="0.2" stroke="#00C9A7" stroke-opacity="0.6"/>
        <text x="52" y="17" font-size="12" font-weight="700" text-anchor="middle" fill="#00C9A7">EM ESTUDO 📚</text>
        <rect x="115" y="0" width="158" height="26" rx="6" fill="#0078D4" fill-opacity="0.25" stroke="#0078D4" stroke-opacity="0.6"/>
        <text x="194" y="17" font-size="12" font-weight="600" text-anchor="middle" fill="#50E6FF">SQL + AI VECTORS</text>
        <rect x="283" y="0" width="155" height="26" rx="6" fill="#7CFF6B" fill-opacity="0.18" stroke="#7CFF6B" stroke-opacity="0.6"/>
        <text x="360" y="17" font-size="12" font-weight="600" text-anchor="middle" fill="#7CFF6B">MICROSOFT LEARN</text>
      </g>
    </g>
  </g>
</svg>
