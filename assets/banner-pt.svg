<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="SEMEAR. Semear, Estudar, Mostrar, Exercitar, Avaliar, Revisar. Um método de estudo para certificações de dados e nuvem, com IA como parceira de treino.">
