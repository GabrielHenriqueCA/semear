      <text x="444" y="224" font-size="24" font-weight="600" letter-spacing="0.5" fill="#CFFAF0"><tspan fill="#7CFF6B">S</tspan>emear · <tspan fill="#7CFF6B">E</tspan>studar · <tspan fill="#7CFF6B">M</tspan>ostrar · <tspan fill="#7CFF6B">E</tspan>xercitar · <tspan fill="#7CFF6B">A</tspan>valiar · <tspan fill="#7CFF6B">R</tspan>evisar</text>
